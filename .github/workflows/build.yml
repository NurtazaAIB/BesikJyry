name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: besikjyry-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || exit 1
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: printf "%s" "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/besik-release.jks"
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: BesikJyry-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: gradle --no-daemon assembleRelease
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/besik-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Publish latest APK for in-app updater
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BesikJyry.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest stable APK" --notes "Signed APK built from main."
          gh release upload latest BesikJyry.apk --clobber
          gh release edit latest --title "BesikJyry 1.0.${{ github.run_number }}" --notes "Signed APK built from main at ${{ github.sha }}."
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
